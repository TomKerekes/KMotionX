# LinuxCNC on a KFLOP or a Kogna through KMotion: Tom's bench, a Minirouter-type machine -
# three step/dir axes on JP7 (MinirouterInit.c, the Minirouter's own setup), a jogged spindle
# axis - with nothing attached to the board, and the home, limit and probe switches simulated
# on the board's virtual I/O bits 48-63 (BenchLoop.c makes them from the axes' positions), so
# Machine on, homing, limits, probing, coolant and the user M codes can all be exercised on a
# board on the desk. Nothing here is board-specific: the same programs compile for whichever
# board kmotion-motion finds. The bits:
#   48 49 50  home switches of channels 0 1 2      57  probe (G38; SetBit 57 from the console trips it)
#   51 52 53  negative limit switches               58 59  spindle CW / CCW (the Spindle Using Jogs programs)
#   54 55 56  positive limit switches               60 61 62  coolant mist, flood, M64/M65 P0
#                                                   63  M100 P (mcodes/M100.c)
# Rigid tapping and threading (G33, G33.1, G76, G84) follow a spindle encoder: the bench gets one
# with a single wire looping the spindle's step/dir generator back into an encoder input, the
# same pins on either board (spindle/SpindleAxis.c); without the wire those cycles time out.
#
# For your own machine: copy this folder, then
#   - the switches above are SIMULATED, for a bench with nothing attached (BenchLoop.c,
#     SIMULATE_SWITCHES): set it to 0 on a real machine
#   - home switches: name their input bits in Home.c (SwitchBit[]) and keep each joint's
#     HOME_SEARCH_VEL / HOME_LATCH_VEL (sign = direction toward the switch). No home switch on a
#     joint: HOME_SEARCH_VEL = 0 - the joint is homed where it stands, the GUI's Home button sets
#     the position (HOME_OFFSET) with no move, as KMotionCNC's "set zero" does
#   - limit switches: name their input bits in [KMOTION] LIMIT_NEG_BITS / LIMIT_POS_BITS (one per
#     joint, in joint order) and LIMIT_ACTIVE (the level that means made). No limit switches: -1
#     for every joint, and only the soft limits ([JOINT_n] MIN_LIMIT / MAX_LIMIT) apply
#   - probe: PROBE_BIT, or -1 without one; the coolant and M code output bits likewise
#   - MinirouterInit.c: the channels' setup (step/dir, servo, scales, limits), the Minirouter's here

# General note: Comments can either be preceded with a # or ; - either is
# acceptable, although # is in keeping with most linux config files.

# General section -------------------------------------------------------------
[EMC]

# Version of this INI file
VERSION = 1.1

# Name of machine, for use with display, etc.
MACHINE = kmotion-minirouter: LinuxCNC on a KFLOP or Kogna through KMotion (TP3)

# Debug level, 0 means no messages. See src/emc/nml_int/emcglb.h for others
#DEBUG = 0x7FFFFFFF
DEBUG = 0

# Sections for display options ------------------------------------------------
[DISPLAY]
# KMotionCNC's buttons (Back/Forward in feed hold, Measure, Geo reload) as a gladevcp panel in
# the main screen's bottom row (box_custom_1, between the tool info and the velocity box); its
# pins are netted to kmotion-motion by panels/kmotion-panel.hal, which gladevcp runs itself
EMBED_TAB_NAME = KMotion
EMBED_TAB_LOCATION = box_custom_1
EMBED_TAB_COMMAND = gladevcp -c kmotion-panel -x {XID} -u ../../panels/kmotion-panel.py -H ../../panels/kmotion-panel.hal ../../panels/kmotion-panel.ui

# Name of display program, e.g., axis
# gmoccapy shows the spindle speed (spindle.0.speed-out); AXIS: DISPLAY = axis
DISPLAY = gmoccapy
# gmoccapy's settings file, in this folder (kept out of git)
PREFERENCE_FILE_PATH = gmoccapy.pref

# Cycle time, in seconds, that display will sleep between polls
CYCLE_TIME = 0.100

# Path to help file
HELP_FILE = doc/help.txt

# Initial display setting for position, RELATIVE or MACHINE
POSITION_OFFSET = RELATIVE

# Initial display setting for position, COMMANDED or ACTUAL
POSITION_FEEDBACK = ACTUAL

# Highest value that will be allowed for feed override, 1.0 = 100%
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0

MAX_LINEAR_VELOCITY = 9.84
DEFAULT_LINEAR_VELOCITY = .25
DEFAULT_SPINDLE_SPEED = 200
# Prefix to be used
PROGRAM_PREFIX = /home/tk/linuxcnc-dev/nc_files/

# Introductory graphic
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 0

#EDITOR = geany
TOOL_EDITOR = tooledit

#Prevent tool mark disappearing with small tool diameter in g-code preview widget
GCODE_VIEW_TOOL_MIN_DIA = 0.08

INCREMENTS = 1 in, 0.1 in, 10 mil, 1 mil, 1mm, .1mm, 1/8000 in

[TASK]

# Name of task controller program, e.g., milltask
TASK = milltask

# Cycle time, in seconds, that task controller will sleep between polls
CYCLE_TIME = 0.001

# Part program interpreter section --------------------------------------------
[RS274NGC]

# File containing interpreter variables
PARAMETER_FILE = sim.var
# where task looks for the user M codes M100-M199 (executables named M1xx; relative to this folder)
USER_M_PATH = mcodes
# M6 on the board: remapped to ngc/kmotion_m6.ngc (SUBROUTINE_PATH), which runs the mcodes/M198
# wrapper with the selected pocket and tool - kmotion-motion then runs [KMOTION] TOOL_CHANGE below
# and waits for it - and tells LinuxCNC the tool is in (M61). Without these two lines M6 is
# LinuxCNC's own: iocontrol's tool-change pins, looped back at once in the HAL file
SUBROUTINE_PATH = ../../ngc
REMAP = M6 modalgroup=6 ngc=kmotion_m6

# Motion control section ------------------------------------------------------
# G74 / G84 as rigid taps (the board's spindle-synchronized tapping, as G33.1), with the
# interpreter patch patches/interp-rigid-tap-cycles.patch; without it the stock floating-chuck cycle
RIGID_TAP_CYCLES = 1

[EMCMOT]

EMCMOT = kmotion-motion

# Timeout for comm to emcmot, in seconds. 10, not LinuxCNC's usual 1: kmotion-motion connects to
# the board as it starts, a second or more for a KFLOP on USB in a VM, and task's first command
# raced that ("USRMOT: ERROR: command 32 timeout", "emcTrajInit failed" at the start)
COMM_TIMEOUT = 10.0

# BASE_PERIOD is unused in this configuration but specified in core_sim.hal
BASE_PERIOD = 0
# Servo task period, in nano-seconds
SERVO_PERIOD = 1000000

# section for main IO controller parameters -----------------------------------
[EMCIO]
# tool table file
TOOL_TABLE = sim.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

# Hardware Abstraction Layer section --------------------------------------------------
[HAL]

# The run script first uses halcmd to execute any HALFILE
# files, and then to execute any individual HALCMD commands.
#

# list of hal config files to run through halcmd
# files are executed in the order in which they appear
HALFILE = kmotion-minirouter.hal

# list of halcmd commands to execute
# commands are executed in the order in which they appear
#HALCMD = save neta

# Single file that is executed after the GUI has started.  Only supported by
# AXIS at this time (only AXIS creates a HAL component of its own)
# run after the GUI has made its pins: gmoccapy's spindle bar shows the measured speed
# (comment it out for DISPLAY = axis, which has no gmoccapy pins)
POSTGUI_HALFILE = gmoccapy-postgui.hal

HALUI = halui

# Trajectory planner section --------------------------------------------------
[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 9.84
# gmoccapy's starting jog speed (without it, half of MAX_LINEAR_VELOCITY)
DEFAULT_LINEAR_VELOCITY = 0.25
DEFAULT_LINEAR_ACCELERATION = 98.4
MAX_LINEAR_ACCELERATION = 98.4
POSITION_FILE = position.txt

[SPINDLE_0]
# motion clamps every spindle speed to these, and G96 without a D word runs into them as X
# nears the center (KMotionCNC's cap there is 10^9 RPM): the bench's channel 3 at 3000 RPM
# is 50000 counts/s
MAX_FORWARD_VELOCITY = 3000
MAX_REVERSE_VELOCITY = 3000

[KINS]
KINEMATICS = trivkins
JOINTS = 3

# Axes sections ---------------
[AXIS_X]
MAX_VELOCITY = 9.84
MAX_JERK = 9840
MAX_ACCELERATION = 98.4
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0

[AXIS_Y]
MAX_VELOCITY = 9.84
MAX_JERK = 9840
MAX_ACCELERATION = 98.4
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0

[AXIS_Z]
MAX_VELOCITY = 9.84
MAX_JERK = 9840
MAX_ACCELERATION = 98.4
MIN_LIMIT = -8.0
MAX_LIMIT = 0.12

# Joints sections -------------
[JOINT_0]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 10
MAX_ACCELERATION = 100
MAX_JERK = 10000              ; the planner's (ACTUATOR_LIMITS); missing, it read as 0 and the planner limited the feed to a 20 s stop
BACKLASH = 0.000
INPUT_SCALE = 2540
OUTPUT_SCALE = 1.000
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -0.5        ; in/s toward the switch (sign = direction); 0 = homed where it stands
HOME_LATCH_VEL = -0.01         ; same sign: approach the switch again slowly
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

[JOINT_1]
TYPE = LINEAR
HOME = 0.000
MAX_VELOCITY = 10
MAX_ACCELERATION = 100
MAX_JERK = 10000              ; the planner's (ACTUATOR_LIMITS); missing, it read as 0 and the planner limited the feed to a 20 s stop
BACKLASH = 0.000
INPUT_SCALE = 2540
OUTPUT_SCALE = 1.000
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -10.0
MAX_LIMIT = 10.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -0.5        ; in/s toward the switch (sign = direction); 0 = homed where it stands
HOME_LATCH_VEL = -0.01         ; same sign: approach the switch again slowly
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 2

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MAX_VELOCITY = 10
MAX_ACCELERATION = 100
MAX_JERK = 10000              ; the planner's (ACTUATOR_LIMITS); missing, it read as 0 and the planner limited the feed to a 20 s stop
BACKLASH = 0.000
INPUT_SCALE = 2540
OUTPUT_SCALE = 1.000
MIN_LIMIT = -8.0

# Normally the Z max should be 0.000!
# The only reason it's greater than 0 here is so that the splash screen
# gcode will run.
MAX_LIMIT = 0.12

FERROR = 0.050
MIN_FERROR = 0.010
HOME_OFFSET = 1.0
HOME_SEARCH_VEL = -0.5        ; in/s toward the switch (sign = direction): negative so Z's Dest can reach the -3000-count sim switch
HOME_LATCH_VEL = -0.01         ; same sign: approach the switch again slowly
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0

# kmotion-motion: KMotion's trajectory planner (see KMotionX/linuxcnc/README.md).
# Axis limits come from [AXIS_*] MAX_VELOCITY / MAX_ACCELERATION / MAX_JERK (jerk
# defaults to 10 x accel), counts per unit from [JOINT_n] INPUT_SCALE.
[KMOTION]
MODE = board                 ; the board KMotionServer finds: a KFLOP on USB or a Kogna on Ethernet
THIRD_ORDER = 1
CUBIC_KNOTS = 1
ACTUATOR_LIMITS = 1
LOG_SEGMENTS = 1
BREAK_ANGLE = 30
COLLINEAR_TOL = 0.0005
CORNER_TOL = 0.003
FACET_ANGLE = 0.5
# a junction of two moves of one feed, at least one of them too short to hold a corner blend of the
# tolerance, is a facet of a curve (an arc's chords, a CAM polyline), not a corner: the planner
# smooths it with its filter and its own caps set the speed (the curvature, the tolerance, the feed).
# 0 blends every junction as a corner, as the planner did before
CURVE_FACETS = 1
LOOKAHEAD = 3.0
# board channel per axis X Y Z A B C U V (the coordinate system)
CHANNELS = 0 1 2 -1 -1 -1 -1 -1
# run once at start, in order: Tom's axis setup (100 counts/mm, step/dir, DefineCS 0 1 2),
# then the bench's spindle axis, channel 3 (paths absolute or relative to this ini)
INIT_PROGRAM = MinirouterInit.c          ; the Minirouter's axis setup, a KFLOP machine: step/dir on JP7 (a copy of KMotionXCNC settings/c-programs/MinirouterInit.c)
INIT_PROGRAM = spindle/SpindleAxis.c
INIT_THREAD = 1
# started after the init programs and left running in their thread (forever loops), any
# number: <thread> <file>. Not a thread the spindle or homing programs load into. Every
# running thread slows down thread 0, so keep the continuous work in one loop in thread 1
# (the init programs are done with it by then), each part #included and enabled as needed.
# Bench: BenchLoop.c services G96 (Dynomotion's ServiceCSS(), spindle/CSSJog.c), the probe
# watcher for G38 (ServiceProbe(), probe/ProbeService.c) and the switch simulator for the bare
# board (SimulateSwitches(): the home switches on bits 48-50 are made when an axis has jogged
# past -1000/-2000/-3000 counts, the limit switches on 51-56 beyond that - without it a home
# search would jog the open-loop axis for ever)
START_PROGRAM = 1 BenchLoop.c
HOME_PROGRAM = Home.c          ; homes through the board (relative to this ini); none = joints are homed where they stand
HOME_THREAD = 2
# which joints are homed is remembered on the board in this persist variable (bit = joint),
# across LinuxCNC sessions: a start that finds every axis enabled reads it and those joints'
# next homing request is answered where they stand, no homing run; a start that finds an
# axis disabled clears it, the board's power loses it. A board program may set or clear it
HOMED_PERSIST = 199
HOME_TIMEOUT_S = 120
# Rigid tapping (G33.1, after M3 S): the tap move is planned through the bottom plus
# TAP_OVERSHOOT_REVS revolutions (the spindle's deceleration) and launched in the board's
# spindle-sync mode, so every actuator follows the spindle encoder through any kinematics;
# TAP_PROGRAM runs the spindle meanwhile - the revolutions for the depth, the reversal at
# G33.1's I times the speed, the stop back at the start (Tap.c: the spindle's channel and
# counts per revolution are SPINDLE_SPEED_AXIS / SPINDLE_COUNTS_PER_REV, how it is driven is
# at the top of Tap.c). Persist 192-198. The spindle is
# then told to run again as LinuxCNC has it. Without TAP_PROGRAM a G33.1 is refused.
# (needs the spindle encoder: the bench's loop-back wire, spindle/SpindleAxis.c; without it
# the tap times out after TAP_TIMEOUT_S)
TAP_PROGRAM = Tap.c
TAP_THREAD = 4
TAP_TIMEOUT_S = 120
TAP_OVERSHOOT_REVS = 6         ; the bench spindle decelerates from 600 RPM in a second: 5 revolutions
# Spindle: what LinuxCNC's M3, M4, M5 and S do on the board, as KMotionCNC's Tool Setup
# M3 - M9 page sets them up (Dynomotion's help page "KMotionCNC Spindle Control"). Each is:
#   SETBIT <bit> <state>                      SETTWOBITS <bit> <state> <bit> <state>
#   DAC <dac> <scale> <offset> <min> <max>    RPM x scale + offset, clamped to min..max
#   PROGRAM <thread> <var> <file>             run a C program (a .c is compiled each time)
#   PROGRAM_WAIT <thread> <var> <file>        ... and wait until it ends
#   PROGRAM_WAIT_SYNC <thread> <var> <file>   ... wait, then re-read the axis positions
# <var> is the persist variable a program gets: S writes the RPM (after the spindle
# override) as a float, in G96 mode the surface speed in in/s as KMotionCNC does,
# M3/M4/M5 their number; -1 writes nothing. Files are relative to this ini. Spindle on
# runs S then M3/M4, a new speed S, spindle off M5. Without these lines the board isn't
# told about the spindle.
# Bench: Dynomotion's Spindle Using Jogs programs jog channel 3 (spindle/MySpindleDefs.h)
SPINDLE_M3 = PROGRAM_WAIT 3 1 spindle/OnCWJog.c
SPINDLE_M4 = PROGRAM_WAIT 3 1 spindle/OnCCWJog.c
SPINDLE_M5 = PROGRAM_WAIT 3 1 spindle/OffJog.c
SPINDLE_S = PROGRAM_WAIT 3 113 spindle/SpindleJog.c
# The basic configuration instead, KMotionCNC's example: relay bits, speed on Kanalog DAC 7
#SPINDLE_M3 = SETBIT 154 1
#SPINDLE_M4 = SETTWOBITS 154 1 155 1
#SPINDLE_M5 = SETTWOBITS 154 0 155 0
#SPINDLE_S = DAC 7 -2.047 0 -2047 0
# G96 constant surface speed, as KMotionCNC does it: LinuxCNC's surface speed (override
# included), its D maximum RPM and the X of radius 0 go to persist 111-114 and the mode to
# 110 (2 G96, 1 G97); a ServiceCSS() loop on the board (START_PROGRAM above) then sets the
# spindle's speed from X every 50 ms. 0 refuses G96 with an error
SPINDLE_CSS = 1
# The spindle at speed, from the board: LinuxCNC's M3/M4/M5 make the next feed move wait for
# it (as with motmod's spindle.0.at-speed, which still counts too), and kmotion.spindle-at-speed
# shows it. One of:
#   BIT <bit> [<level>]   an input bit at a level (default 1), e.g. the spindle drive's at-speed output
#   AXIS [<channel>]      a jogged spindle axis at its commanded speed: its Dest's speed between
#                         status reads, on the board's own clock, within 1% (at least 1 RPM) of
#                         S - in G96 of what ServiceCSS() makes of X (default channel:
#                         SPINDLE_SPEED_AXIS; uses SPINDLE_COUNTS_PER_REV)
#   NONE                  no wait (the default; only LinuxCNC's own spindle.0.at-speed pin could
#                         hold a move, and nothing drives it here)
# Bench: channel 3, jogged by the Spindle Using Jogs programs
SPINDLE_AT_SPEED = AXIS 3
# AXIS: at speed within this fraction of the commanded speed (at least 1 RPM), and until twice it
# away again (the Dest speed between two status reads jitters with the read timing)
SPINDLE_AT_SPEED_TOLERANCE = 0.02
# Board I/O bits as HAL pins: each OUTPUT_BITS bit follows a pin kmotion.out.<bit> (HAL in; set
# once at start, then on every change), each INPUT_BITS bit drives kmotion.in.<bit> (HAL out,
# from the status read every STATUS_PERIOD_MS; a bit the status carries). Any HAL signal can then
# drive a board output, e.g. iocontrol's coolant or the motion.digital-out-NN of M64/M65.
# Bench (all netted in kmotion-minirouter.hal): mist coolant (M7) on virtual bit 60, flood (M8) on
# 61 (M9 turns both off), and M64 P0 / M65 P0 (motion.digital-out-00) on 62
OUTPUT_BITS = 60 61 62
# board bits read back as HAL pins kmotion.in.<bit>: the probe bit and M100's, for watching them
INPUT_BITS = 57 63
#INPUT_BITS =
# LinuxCNC's digital outputs motion.digital-out-00.. for M64/M65 P<n> (at once); M62/M63, which
# switch in step with the next move, are refused for now
NUM_DIO = 4
# User M codes M100-M199: task runs the executable M1xx in [RS274NGC] USER_M_PATH (here a wrapper
# around kmotion-mcode, see mcodes/M100), which has kmotion-motion carry out MCODE_<n>: one of
# KMotionCNC's M-code actions, as for the spindle above; P and Q go to <var> and <var>+1 as
# floats (-1 for a word not given). The program waited for (PROGRAM_WAIT) holds the G-code.
# Bench: M100 runs mcodes/M100.c in thread 5 with P and Q in persist 10 and 11
MCODE_100 = PROGRAM_WAIT 5 10 mcodes/M100.c
# M6, the tool change (with the REMAP in [RS274NGC]): the same grammar; the selected pocket (slot)
# and tool ID go to <var> and <var>+1 as ints, as KMotionCNC's M6 action writes them, so a
# KMotionCNC ToolChange.c runs unchanged. Bench: ToolChange.c prints them on the console
TOOL_CHANGE = PROGRAM_WAIT 5 9 ToolChange.c
# M101 starts the PC_COMM test program (below) on thread 6 and does not wait for it
MCODE_101 = PROGRAM 6 12 pccomm/PCCommTest.c
# M102 trips the simulated probe 4 s after it is started, for 4 s (probe/ProbeTrip.c, thread 7, not
# waited for): MDI "M102" then "G38.2 Z-1 F2" tests a probe move with nothing wired
MCODE_102 = PROGRAM 7 14 probe/ProbeTrip.c
# The board's commands to the PC (KMotionCNC's PC_COMM: a C program writes a command into
# persist 100, arguments into 101-107, see DSP_KFLOP/PC-DSP.h and C Programs/
# KflopToKMotionCNCFunctions.c) are carried out against LinuxCNC through its NML channels, as a
# GUI's would be: MDI, set-DRO (touch-off), the tool table, run/pause/abort, the overrides,
# messages (kmotion-motion/kmotion-pccomm.cc has the list). PC_COMM = 0 turns it off.
# USER_BUTTON_<n> is the MDI line PC_COMM_USER_BUTTON n runs (KMotionCNC's user buttons)
PC_COMM = 1
USER_BUTTON_0 = (MSG, user button 0 from the board)
# Probing, G38.2-G38.5: the planner runs the probe move like any move (so any kinematics apply)
# while the probe watcher, ServiceProbe() in the board's forever loop (probe/ProbeService.c,
# after Dynomotion's NotifyProbeMach3.c; here in BenchLoop.c), watches PROBE_BIT: kmotion-motion
# arms it for each probe move, and when the probe makes contact (G38.2/.3: the bit at
# PROBE_ACTIVE) or loses it (G38.4/.5), it records the axes' positions and stops the coordinated
# motion; kmotion-motion gives LinuxCNC the probed position (#5061-) and abandons the rest of
# the move. Without PROBE_BIT a probe move runs as a plain move that never trips.
# Bench: virtual bit 57, contact = 1 (a virtual bit starts at 0, open; "SetBit 57" from the
# KMotion console trips it during a G38 move, "ClearBit 57" opens it again)
PROBE_BIT = 57
PROBE_ACTIVE = 1
# KMotionCNC's Measure (the panel's button, kmotion.measure): each press appends the current
# position to this file as the next grid point of a geo correction table, in KMotionCNC's geo
# format - write the three header lines by hand first (rows,cols / spacing x,y / offset x,y),
# jog the tool to each grid point in order (columns first) and press; when the grid is
# complete, copy the file to GEO_FILE and press Geo reload (kmotion.geo-reload). Default
# Measurements.txt in this folder. The Back/Forward buttons (kmotion.hold-reverse/-forward)
# run the paused program backwards/forwards while held, at kmotion.hold-rate (0: 0.2) of the
# programmed speed - KMotionCNC's feed hold buttons; board mode only
MEASURE_FILE = Measurements.txt
# the panel shows its Measure button only with MEASURE_BUTTON = 1 (and Geo reload only with a
# GEO_FILE); Back/Forward are grey unless the program is paused (kmotion.hold-allowed)
MEASURE_BUTTON = 1
# Limit switches, per joint (the board's channels in CHANNELS order; -1 = none): the input bit of
# each joint's negative and positive switch (a bit the status carries) and the level at which a
# switch is made. Read with the status; LinuxCNC's joint.N.neg-lim-sw-in / pos-lim-sw-in HAL pins
# count as well. A switch made trips as in motmod: "joint N on limit switch error", machine off,
# the joint stays homed; the GUI's "ignore limits" (override) lets the next joint jog run off it
# (not further onto it; with identity kinematics, as here, a world jog of the axis follows the
# same rule, under a KINEMATICS world jogs are refused), and the limits count again once that
# jog ends. No program move while a switch is made. A joint being homed is exempt (its home switch may be the limit
# switch); the board's own limit action (LimitSwitchOptions), if set, comes first.
# Bench: BenchLoop.c's SimulateSwitches() makes bits 51-53 below -1500/-2500/-3500 counts and
# 54-56 above +2000 counts (500 counts past the home switches, so a home search stops first).
# A real machine names its own input bits here, or -1 per joint for no switch (soft limits only)
LIMIT_NEG_BITS = 51 52 53 -1 -1 -1 -1 -1
LIMIT_POS_BITS = 54 55 56 -1 -1 -1 -1 -1
LIMIT_ACTIVE = 1
# The spindle speed measured on the board, for the GUI (kmotion.spindle-rpm, -rpm-abs, -rps):
# from the spindle's axis channel, either its commanded Dest (a jogged spindle's real ramps, no
# encoder needed) or its encoder Position, in counts per revolution, filtered with tau seconds.
# Bench: channel 3 at MySpindleDefs.h's 1000 counts/rev; POSITION works too, because
# SpindleAxis.c feeds the step/dir generator's quadrature back into encoder 4
SPINDLE_SPEED_AXIS = 3
SPINDLE_SPEED_FROM = DEST
SPINDLE_COUNTS_PER_REV = 1000
SPINDLE_SPEED_TAU = 0.1
