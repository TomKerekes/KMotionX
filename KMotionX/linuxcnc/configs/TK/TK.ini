# TK: LinuxCNC on a KFLOP or a Kogna through KMotion, converted from a KMotionCNC setup by
# migrate-kmotioncnc on 2026-10-31 (MIGRATION.md in this folder lists every value taken,
# every guess, and what was not converted). The bench configuration configs/kmotion-minirouter has
# the full commentary on each [KMOTION] key.
[EMC]
VERSION = 1.1
MACHINE = TK: LinuxCNC on a KFLOP or Kogna through KMotion (TP3)
DEBUG = 0

[DISPLAY]
# KMotionCNC's buttons (Back/Forward in feed hold, Measure, Geo reload) as a gladevcp panel
EMBED_TAB_NAME = KMotion
EMBED_TAB_LOCATION = box_custom_1
EMBED_TAB_COMMAND = gladevcp -c kmotion-panel -x {XID} -u ../../panels/kmotion-panel.py -H ../../panels/kmotion-panel.hal ../../panels/kmotion-panel.ui
DISPLAY = gmoccapy
PREFERENCE_FILE_PATH = gmoccapy.pref
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.2
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 10
DEFAULT_LINEAR_VELOCITY = 1
DEFAULT_SPINDLE_SPEED = 1000
# KMotionCNC's recent G-code files, copied into this folder's nc_files
PROGRAM_PREFIX = nc_files
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 0
TOOL_EDITOR = tooledit
GCODE_VIEW_TOOL_MIN_DIA = 0.08
INCREMENTS = 1 in, 0.1 in, 10 mil, 1 mil, 1mm, .1mm

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = TK.var
USER_M_PATH = mcodes
RIGID_TAP_CYCLES = 1
# M6 on the board: the remap runs mcodes/M198 with the selected pocket and tool, kmotion-motion runs
# [KMOTION] TOOL_CHANGE and waits, then LinuxCNC is told the tool is in (ngc/kmotion_m6.ngc)
SUBROUTINE_PATH = ../../ngc
REMAP = M6 modalgroup=6 ngc=kmotion_m6

[EMCMOT]
EMCMOT = kmotion-motion
COMM_TIMEOUT = 10.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = tool.tbl
TOOL_CHANGE_POSITION = 0 0 0
TOOL_CHANGE_QUILL_UP = 1

[HAL]
HALFILE = TK.hal
POSTGUI_HALFILE = gmoccapy-postgui.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 10
DEFAULT_LINEAR_VELOCITY = 1
DEFAULT_LINEAR_ACCELERATION = 30
MAX_LINEAR_ACCELERATION = 30
POSITION_FILE = position.txt

[SPINDLE_0]
# motion clamps every spindle speed to these (KMotionCNC had no cap): set your spindle's maximum
MAX_FORWARD_VELOCITY = 100000
MAX_REVERSE_VELOCITY = 100000

[KINS]
KINEMATICS = trivkins
JOINTS = 3

[AXIS_X]
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400
MIN_LIMIT = -100
MAX_LIMIT = 100

[AXIS_Y]
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400
MIN_LIMIT = -100
MAX_LIMIT = 100

[AXIS_Z]
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400
MIN_LIMIT = -100
MAX_LIMIT = 100

[JOINT_0]
# axis X, board channel 0: inch, counts per unit from m_CountsPerInchX
TYPE = LINEAR
HOME = 0.5
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400              ; the INIT program's ch->Jerk
BACKLASH = 0.000
INPUT_SCALE = 10000
OUTPUT_SCALE = 1.000
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -100              ; PLACEHOLDER +-100 (no finite soft limits in the INIT program): set the real travel
MAX_LIMIT = 100
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -0.1        ; units/s toward the switch (sign = direction); 0 = homed where it stands
HOME_LATCH_VEL = 0.01
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 1

[JOINT_1]
# axis Y, board channel 1: inch, counts per unit from m_CountsPerInchY
TYPE = LINEAR
HOME = 0.5
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400              ; the INIT program's ch->Jerk
BACKLASH = 0.000
INPUT_SCALE = 10000
OUTPUT_SCALE = 1.000
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -100              ; PLACEHOLDER +-100 (no finite soft limits in the INIT program): set the real travel
MAX_LIMIT = 100
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -0.1        ; units/s toward the switch (sign = direction); 0 = homed where it stands
HOME_LATCH_VEL = 0.01
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 2

[JOINT_2]
# axis Z, board channel 2: inch, counts per unit from m_CountsPerInchZ
TYPE = LINEAR
HOME = 0.5
MAX_VELOCITY = 10
MAX_ACCELERATION = 30
MAX_JERK = 400              ; the INIT program's ch->Jerk
BACKLASH = 0.000
INPUT_SCALE = 10000
OUTPUT_SCALE = 1.000
FERROR = 0.050
MIN_FERROR = 0.010
MIN_LIMIT = -100              ; PLACEHOLDER +-100 (no finite soft limits in the INIT program): set the real travel
MAX_LIMIT = 100
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = -0.1        ; units/s toward the switch (sign = direction); 0 = homed where it stands
HOME_LATCH_VEL = 0.01
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = NO
HOME_SEQUENCE = 0

[KMOTION]
MODE = board
THIRD_ORDER = 0
CUBIC_KNOTS = 0
ACTUATOR_LIMITS = 0
LOG_SEGMENTS = 0
BREAK_ANGLE = 90
COLLINEAR_TOL = 0.001
CORNER_TOL = 0.001
FACET_ANGLE = 1
CURVE_FACETS = 1
LOOKAHEAD = 1
# board channel per axis X Y Z A B C U V (the coordinate system, from the INIT program's DefineCoordSystem)
CHANNELS = 0 1 2 -1 -1 -1 -1 -1
INIT_PROGRAM = programs/KStep/InitKStep3Axis.c
INIT_THREAD = 1
START_PROGRAM = 1 Loop.c
HOME_PROGRAM = Home.c
HOME_THREAD = 2
HOMED_PERSIST = 199
HOME_TIMEOUT_S = 120
# Spindle: KMotionCNC's M3/M4/M5/S actions, the same grammar (see the bench ini's commentary)
SPINDLE_M3 = PROGRAM 3 0 programs/SpindleUsingJogs/CSS/OnCWJog.c
SPINDLE_M5 = PROGRAM 3 0 programs/SpindleUsingJogs/CSS/OffJog.c
SPINDLE_S = PROGRAM 3 113 programs/SpindleUsingJogs/CSS/SpindleJog.c
SPINDLE_CSS = 1
SPINDLE_SPEED_AXIS = 3
SPINDLE_SPEED_FROM = DEST              ; a jogged spindle axis: its commanded speed; POSITION for an encoder
SPINDLE_COUNTS_PER_REV = 3200
SPINDLE_SPEED_TAU = 0.1
SPINDLE_AT_SPEED = AXIS 3
SPINDLE_AT_SPEED_TOLERANCE = 0.02
NUM_DIO = 4
TOOL_CHANGE = PROGRAM_WAIT_SYNC 4 9 programs/ToolChange.c             ; M6: the pocket and tool ID as ints in <var>, <var>+1
PC_COMM = 1
LIMIT_NEG_BITS = -1 -1 -1 -1 -1 -1 -1 -1
LIMIT_POS_BITS = -1 -1 -1 -1 -1 -1 -1 -1
LIMIT_ACTIVE = 1
MEASURE_FILE = Measurements.txt
MEASURE_BUTTON = 0
