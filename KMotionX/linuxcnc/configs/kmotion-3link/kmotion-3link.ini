# LinuxCNC on Dynomotion's 3 Link pen robot: three Dynamixel XL430 servos (Right, Left, Z) on
# the Kogna's serial servo bus, with the 3Link kinematics and the 3rd order planner on the
# KMotion side. kmotion-motion replaces LinuxCNC's motion module (KMotionX/linuxcnc/README.md);
# this folder's README.md says what is still to be set for the machine.

[EMC]
VERSION = 1.1
MACHINE = kmotion-3link: the 3 Link pen robot on a Kogna through KMotion (TP3)
DEBUG = 0

[DISPLAY]
DISPLAY = gmoccapy
# gmoccapy's settings file, in this folder (kept out of git)
PREFERENCE_FILE_PATH = gmoccapy.pref
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.0
MAX_LINEAR_VELOCITY = 3
DEFAULT_LINEAR_VELOCITY = 0.5
# G-code programs: the demo, DynoMotion3Link.ngc, is in ngc/ (paths are relative to this folder)
PROGRAM_PREFIX = ngc
OPEN_FILE = ngc/DynoMotion3Link.ngc
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 0
TOOL_EDITOR = tooledit
GCODE_VIEW_TOOL_MIN_DIA = 0.02
INCREMENTS = 1 in, 0.1 in, 0.01 in, 10 mm, 1 mm, 0.1 mm

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = 3link.var
# where task looks for the user M codes M100-M199 (executables named M1xx, see mcodes/)
USER_M_PATH = mcodes

[EMCMOT]
EMCMOT = kmotion-motion
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = 3link.tbl
TOOL_CHANGE_POSITION = 0 0 0.5
TOOL_CHANGE_QUILL_UP = 1

[HAL]
HALFILE = kmotion-3link.hal
HALUI = halui

[TRAJ]
COORDINATES = X Y Z
# CAD units are inches (the kinematics' choice); G21 programs are converted by the interpreter
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 3
DEFAULT_LINEAR_VELOCITY = 0.5
DEFAULT_LINEAR_ACCELERATION = 30
MAX_LINEAR_ACCELERATION = 30
POSITION_FILE = position.txt

[KINS]
# The kinematics run on the KMotion side ([KMOTION] KINEMATICS below): the planner turns the
# pen's X Y Z into the three servo angles. LinuxCNC loads no kinematics module (kmotion-motion
# replaces motmod, nothing to loadrt); it only needs to know that the joints are not the axes,
# which kmotion-motion tells it (kinematics type BOTH): joint mode jogs one servo, world mode
# the pen, and both are shown. This line is informational for the GUI.
KINEMATICS = 3Link
JOINTS = 3

# The pen (CAD) axes: inches, X toward the Right servo, Y toward the paper, Z up; x=0 y=0 is the
# center of travel, z=0 the pen at the paper (Kinematics3Link.cpp). World jogs run to these
# limits; programmed moves are checked against them by the interpreter. The reach is not a box:
# keep them inside the real workspace (the demo spans X -3.1..3.7, Y -1.2..0.7, Z 0..0.63)
[AXIS_X]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -4.0
MAX_LIMIT = 4.0

[AXIS_Y]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -2.5
MAX_LIMIT = 2.5

[AXIS_Z]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -0.1
MAX_LIMIT = 1.0

# The joints are the servos, in degrees: joint 0 = Right (servo ID 0, channel 0), 1 = Left,
# 2 = Z, as Kinematics3Link.cpp numbers them (0 = arm along +X for Right/Left, counterclockwise
# from above; 0 = arm toward the paper for Z, 90 = straight up). INPUT_SCALE is the servo's
# counts per degree: 4096 counts/rev / 360 = 11.37778, NEGATIVE if the servo counts the other
# way (the pen then moves opposite to the program: flip the sign). DxlAxisInit3.c's
# InputOffset0/OutputOffset make a chosen pose read 0 counts; the kinematics' OFFSET_*_DEG are 0,
# so that pose must be the arm at its geometric 0.
# The limits (MAX_VELOCITY, MAX_ACCELERATION, MAX_JERK: the planner's, through [KMOTION]
# ACTUATOR_LIMITS) are DxlAxisInit3.c's Vel/Accel/Jerk in counts/s converted to degrees:
# Vel 400 = 35 deg/s, 200 = 17.6, Accel 8000 = 703, Jerk 80000 = 7031. MIN/MAX_LIMIT bound
# joint jogs: set them to the mechanism's real range.
# The servos remember their position (absolute, multi-turn), so homing is "where it stands"
# (HOME_SEARCH_VEL = 0); gmoccapy's Home All just declares them homed.
[JOINT_0]
TYPE = ANGULAR
NAME = Right
INPUT_SCALE = 11.37778
MAX_VELOCITY = 35
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = -170
MAX_LIMIT = 170
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_1]
TYPE = ANGULAR
NAME = Left
INPUT_SCALE = 11.37778
MAX_VELOCITY = 17.6
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = -170
MAX_LIMIT = 170
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = ANGULAR
NAME = Z
INPUT_SCALE = 11.37778
MAX_VELOCITY = 17.6
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = -45
MAX_LIMIT = 135
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

# kmotion-motion: KMotion's trajectory planner and the board (see KMotionX/linuxcnc/README.md)
[KMOTION]
MODE = board                 ; the Kogna, through KMotionServer
THIRD_ORDER = 1
CUBIC_KNOTS = 1
# the planner's limits are the actuators' - the joints' MAX_VELOCITY/ACCELERATION/JERK above, in
# degrees - rather than per CAD axis; the feed rate and the path tolerances stay in inches
ACTUATOR_LIMITS = 1
LOG_SEGMENTS = 0
BREAK_ANGLE = 30
COLLINEAR_TOL = 0.0005
CORNER_TOL = 0.002
FACET_ANGLE = 0.5
LOOKAHEAD = 3.0
# the planner's kinematics, by the names KMotionCNC's Data/Kinematics.txt takes (3Link, Scara,
# Geppetto, ...); the geometry is in GCodeInterpreter/Kinematics3Link.cpp
KINEMATICS = 3Link
# board channel per axis X Y Z A B C U V (the coordinate system; the joints in that order)
CHANNELS = 0 1 2 -1 -1 -1 -1 -1
# Machine on runs this program in its thread instead of enabling the axes itself, and waits
# until every axis is enabled (at most ENABLE_TIMEOUT_S): Tom's DxlAxisInit3.c sets the three
# servos up (gains, offsets, torque on), enables the axes at their measured positions and keeps
# running as a watchdog that turns the torque off and ends when an axis stays disabled, which is
# what machine off (DisableAxis) does. Its messages go to the board's console (kmotion-motion's
# terminal). No INIT_PROGRAM: there is nothing to set up before machine on
ENABLE_PROGRAM = 1 DxlAxisInit3.c
ENABLE_TIMEOUT_S = 15
# The demo program starts with M100: nothing is assigned to it yet (mcodes/M100.c prints it).
# M3/M5 in it do nothing here: no spindle actions are configured
MCODE_100 = PROGRAM_WAIT 5 10 mcodes/M100.c
