# LinuxCNC on Dynomotion's 3 Link pen robot: three Dynamixel XL430 servos (Right, Left, Z) on
# the Kogna's serial servo bus, with the 3Link kinematics and the 3rd order planner on the
# KMotion side. kmotion-motion replaces LinuxCNC's motion module (KMotionX/linuxcnc/README.md);
# this folder's README.md says what is still to be set for the machine.

[EMC]
# The axes stay enabled when LinuxCNC exits, as KMotionCNC leaves them, and the next start
# finds them enabled and comes up with Machine on (autostart.py below) - no init, no homing.
# Needs the two patches in linuxcnc/patches/ (task's shutdown and gmoccapy's quit send no
# disable with this key); a stock LinuxCNC ignores the key and ends a session as usual.
# Machine off and E-stop by the operator disable the axes at once, as ever
KEEP_ENABLED_ON_EXIT = 1
VERSION = 1.1
MACHINE = kmotion-3link: the 3 Link pen robot on a Kogna through KMotion (TP3)
DEBUG = 0

[DISPLAY]
DISPLAY = gmoccapy
# KMotionCNC's buttons (Back/Forward in feed hold, Measure, Geo reload) as a gladevcp panel in
# the main screen's bottom row; its pins are netted to kmotion-motion by panels/kmotion-panel.hal,
# which gladevcp runs itself (-H) once the panel is up
EMBED_TAB_NAME = KMotion
EMBED_TAB_LOCATION = box_custom_1
EMBED_TAB_COMMAND = gladevcp -c kmotion-panel -x {XID} -u ../../panels/kmotion-panel.py -H ../../panels/kmotion-panel.hal ../../panels/kmotion-panel.ui
# until the servos are enabled their position is unknown, and the first Machine on draws a
# line in the plot from where the DROs stood to the real position: the patched gmoccapy
# (linuxcnc/patches/) clears the plot at that first position change
CLEAR_PLOT_AT_FIRST_MACHINE_ON = 1
# gmoccapy's settings file, in this folder (kept out of git)
PREFERENCE_FILE_PATH = gmoccapy.pref
CYCLE_TIME = 0.100
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 1.5
MAX_SPINDLE_OVERRIDE = 1.0
DEFAULT_SPINDLE_SPEED = 600
MAX_LINEAR_VELOCITY = 3
DEFAULT_LINEAR_VELOCITY = 0.5
# G-code programs: the demo, DynoMotion3Link.ngc, is in ngc/ (paths are relative to this folder)
PROGRAM_PREFIX = ngc
OPEN_FILE = ngc/DynoMotion3Link.ngc
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 0
TOOL_EDITOR = tooledit
GCODE_VIEW_TOOL_MIN_DIA = 0.02
INCREMENTS = 1 in, 0.1 in, 0.01 in, 10 mm, 1 mm, 0.1 mm

[TASK]
TASK = milltask
CYCLE_TIME = 0.001

[RS274NGC]
PARAMETER_FILE = 3link.var
# where task looks for the user M codes M100-M199 (executables named M1xx, see mcodes/)
USER_M_PATH = mcodes

[EMCMOT]
EMCMOT = kmotion-motion
COMM_TIMEOUT = 1.0
BASE_PERIOD = 0
SERVO_PERIOD = 1000000

[EMCIO]
TOOL_TABLE = 3link.tbl
TOOL_CHANGE_POSITION = 0 0 0.5
TOOL_CHANGE_QUILL_UP = 1

[HAL]
HALFILE = kmotion-3link.hal
# runs once the GUI is up: sets gui-ready, which autostart.py waits for before machine on
POSTGUI_HALFILE = gmoccapy-postgui.hal
HALUI = halui

[TRAJ]
# moves are allowed unhomed, as in KMotionCNC (homing here only declares a position; a
# machine that must not move before homing keeps its interlock on the board, a persist variable)
NO_FORCE_HOMING = 1
COORDINATES = X Y Z
# CAD units are inches (the kinematics' choice); G21 programs are converted by the interpreter
LINEAR_UNITS = inch
ANGULAR_UNITS = degree
MAX_LINEAR_VELOCITY = 3
DEFAULT_LINEAR_VELOCITY = 0.5
DEFAULT_LINEAR_ACCELERATION = 30
MAX_LINEAR_ACCELERATION = 30
POSITION_FILE = position.txt

[SPINDLE_0]
# motion clamps every spindle speed to these: the fake spindle's channel 3 at 3000 RPM is
# 50000 counts/s
MAX_FORWARD_VELOCITY = 3000
MAX_REVERSE_VELOCITY = 3000

[KINS]
# The kinematics run on the KMotion side ([KMOTION] KINEMATICS below): the planner turns the
# pen's X Y Z into the three servo angles. LinuxCNC loads no kinematics module (kmotion-motion
# replaces motmod, nothing to loadrt); it only needs to know that the joints are not the axes,
# which kmotion-motion tells it (kinematics type BOTH): joint mode jogs one servo, world mode
# the pen, and both are shown. This line is informational for the GUI.
KINEMATICS = 3Link
JOINTS = 3

# The pen (CAD) axes: inches, X toward the Right servo, Y toward the paper, Z up; x=0 y=0 is the
# center of travel, z=0 the pen at the paper (Kinematics3Link.cpp). World jogs run to these
# limits; programmed moves are checked against them by the interpreter. The reach is not a box:
# keep them inside the real workspace (the demo spans X -3.1..3.7, Y -1.2..0.7, Z 0..0.63)
[AXIS_X]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -4.0
MAX_LIMIT = 4.0

[AXIS_Y]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -2.0
MAX_LIMIT = 2.0

[AXIS_Z]
MAX_VELOCITY = 3
MAX_ACCELERATION = 30
MAX_JERK = 300
MIN_LIMIT = -0.1
MAX_LIMIT = 1.0

# The joints are the servos, in degrees: joint 0 = Right (servo ID 0, channel 0), 1 = Left,
# 2 = Z, as Kinematics3Link.cpp numbers them (0 = arm along +X for Right/Left, counterclockwise
# from above; 0 = arm toward the paper for Z, 90 = straight up). INPUT_SCALE is the servo's
# counts per degree: 4096 counts/rev / 360 = 11.37778, NEGATIVE if the servo counts the other
# way (the pen then moves opposite to the program: flip the sign). DxlAxisInit3.c's
# InputOffset0/OutputOffset make a chosen pose read 0 counts; the kinematics' OFFSET_*_DEG are 0,
# so that pose must be the arm at its geometric 0.
# The limits (MAX_VELOCITY, MAX_ACCELERATION, MAX_JERK: the planner's, through [KMOTION]
# ACTUATOR_LIMITS) are DxlAxisInit3.c's Vel/Accel/Jerk in counts/s converted to degrees:
# Vel 400 = 35 deg/s, 200 = 17.6, Accel 8000 = 703, Jerk 80000 = 7031. MIN/MAX_LIMIT bound
# joint jogs: set them to the mechanism's real range.
# The servos remember their position (absolute, multi-turn), so homing is "where it stands"
# (HOME_SEARCH_VEL = 0); gmoccapy's Home All just declares them homed.
[JOINT_0]
TYPE = ANGULAR
NAME = Right
INPUT_SCALE = 11.37778
MAX_VELOCITY = 35
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = -90
MAX_LIMIT = 90
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0
# MIN/MAX_LIMIT: the arms' real range, each within one turn of its servo. A program move
# whose pose needs a servo beyond it is refused. Over the +/-2 in travel box the Right arm
# spans -42..24 deg and the Left 138..194, so each gets a 180 deg window around that
# (Right -90..90, Left 90..270) until the real mechanical range is known.

[JOINT_1]
TYPE = ANGULAR
NAME = Left
INPUT_SCALE = 11.37778
MAX_VELOCITY = 17.6
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = 90
MAX_LIMIT = 270
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

[JOINT_2]
TYPE = ANGULAR
NAME = Z
INPUT_SCALE = 11.37778
MAX_VELOCITY = 17.6
MAX_ACCELERATION = 700
MAX_JERK = 7000
MIN_LIMIT = -45
MAX_LIMIT = 135
FERROR = 5
MIN_FERROR = 1
HOME = 0
HOME_OFFSET = 0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_SEQUENCE = 0

# kmotion-motion: KMotion's trajectory planner and the board (see KMotionX/linuxcnc/README.md)
# Machine on as soon as task is up when every axis is still enabled on the board (left so by
# [EMC] KEEP_ENABLED_ON_EXIT): autostart.py does E-stop reset + Machine on and nothing else - no
# init, no homing; with any axis disabled it leaves LinuxCNC in E-stop as usual. Comment APP
# out for LinuxCNC's normal start
[APPLICATIONS]
DELAY = 1
APP = autostart.py

[KMOTION]
MODE = board                 ; the Kogna, through KMotionServer
THIRD_ORDER = 1
CUBIC_KNOTS = 1
# the planner's limits are the actuators' - the joints' MAX_VELOCITY/ACCELERATION/JERK above, in
# degrees - rather than per CAD axis; the feed rate and the path tolerances stay in inches
ACTUATOR_LIMITS = 1
LOG_SEGMENTS = 0
BREAK_ANGLE = 30
COLLINEAR_TOL = 0.0005
CORNER_TOL = 0.002
FACET_ANGLE = 0.5
LOOKAHEAD = 3.0
# the planner's kinematics, by the names KMotionCNC's Data/Kinematics.txt takes (3Link, Scara,
# Geppetto, ...); the geometry is in GCodeInterpreter/Kinematics3Link.cpp
KINEMATICS = 3Link
# KMotionCNC's Geo Correction File for this robot, if one is used (relative to this ini):
#GEO_FILE = 3link-geo.txt
# KMotionCNC's Measure (the panel's button): each press appends the current position to this
# file as the next grid point of a geo correction table, in the geo format - write the header
# by hand first (rows,cols / spacing x,y / offset x,y), jog the pen to each grid point in order
# (columns first) and press; complete, copy it to GEO_FILE and press Geo reload
MEASURE_FILE = Measurements.txt
# the panel shows its Measure button only with MEASURE_BUTTON = 1 (and Geo reload only with a
# GEO_FILE); Back/Forward are grey unless the program is paused (kmotion.hold-allowed)
MEASURE_BUTTON = 1
# board channel per axis X Y Z A B C U V (the coordinate system; the joints in that order)
CHANNELS = 0 1 2 -1 -1 -1 -1 -1
# Machine on runs this program in its thread instead of enabling the axes itself, and waits
# until every axis is enabled (at most ENABLE_TIMEOUT_S): Tom's DxlAxisInit3.c sets the three
# servos up (gains, offsets, torque on), enables the axes at their measured positions and keeps
# running as a watchdog that turns the torque off and ends when an axis stays disabled, which is
# what machine off (DisableAxis) does. Its messages go to the board's console (kmotion-motion's
# terminal). The INIT_PROGRAM, run once at start, sets the fake spindle's channel up
# (spindle/SpindleAxis.c); the servos need nothing before machine on
INIT_PROGRAM = spindle/SpindleAxis.c
INIT_THREAD = 3
ENABLE_PROGRAM = 1 DxlAxisInit3.c
# the servos are absolute: every joint is homed whenever the machine is on, there is no
# homing step (gmoccapy's Home All would only declare the same). For a machine that homes
# for real, HOMED_PERSIST = <persist variable> remembers on the board which joints are
# homed, across LinuxCNC sessions, until the board loses power or a start finds an axis
# disabled (see kmotion-kogna.ini)
ALWAYS_HOMED = 1
ENABLE_TIMEOUT_S = 60        ; headroom: the program takes 0.2 s when timed, one start timed out at 15 s unexplained
# The demo program starts with M100: nothing is assigned to it yet (mcodes/M100.c prints it)
MCODE_100 = PROGRAM_WAIT 5 10 mcodes/M100.c
# Spindle: a fake one, the bench's - channel 3, a step/dir axis whose quadrature is looped
# into encoder 4 (spindle/SpindleAxis.c, run at start), jogged by Dynomotion's Spindle Using
# Jogs programs on thread 3 for M3, M4, M5 and S (S writes the RPM to persist 113). No CSS
# loop here (thread 1 is DxlAxisInit3.c's): G96 is refused. The spindle is at speed when
# its channel's Dest runs at the commanded speed; the GUI's speed display reads the
# encoder's Position (kmotion.spindle-rpm, gmoccapy-postgui.hal). See kmotion-kogna.ini for
# the other forms (relay bits, a DAC)
SPINDLE_M3 = PROGRAM_WAIT 3 1 spindle/OnCWJog.c
SPINDLE_M4 = PROGRAM_WAIT 3 1 spindle/OnCCWJog.c
SPINDLE_M5 = PROGRAM_WAIT 3 1 spindle/OffJog.c
SPINDLE_S = PROGRAM_WAIT 3 113 spindle/SpindleJog.c
SPINDLE_CSS = 0
SPINDLE_AT_SPEED = AXIS 3
# AXIS: at speed within this fraction of the commanded speed (at least 1 RPM), and until twice it
# away again (the Dest speed between two status reads jitters with the read timing)
SPINDLE_AT_SPEED_TOLERANCE = 0.03
SPINDLE_SPEED_AXIS = 3
SPINDLE_SPEED_FROM = POSITION
SPINDLE_COUNTS_PER_REV = 1000
SPINDLE_SPEED_TAU = 0.1
# Rigid tapping (G33.1, after M3 S): the tap move - any direction, through the 3Link
# kinematics - is planned through the bottom plus TAP_OVERSHOOT_REVS revolutions (the
# spindle's deceleration) and launched in the board's spindle-sync mode; Tap.c on thread 4
# runs the spindle meanwhile (the revolutions for the depth, the reversal at G33.1's I times
# the speed, the stop back at the start) and the spindle then runs again as before
TAP_PROGRAM = Tap.c
TAP_THREAD = 4
TAP_TIMEOUT_S = 120
TAP_OVERSHOOT_REVS = 6         ; channel 3 decelerates from 600 RPM in a second: 5 revolutions
